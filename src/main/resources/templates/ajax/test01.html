<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>즐겨찾기 추가하기</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
    <h2>즐겨 찾기 추가하기</h2>
    <label>제목</label><input type="text" id="nameInput" class="form-control col-11 ml-2 mr-3">
    <label>주소</label>
    <div class="d-flex m-2">
        <input type="text" class="form-control col-11 mr-3" id="urlInput">
        <button type="button" class="btn btn-info small" id="checkBtn">중복확인</button>
    </div>
    <br>
    <div class="d-grid gap-2">
        <button type="button" class="btn btn-success">추가</button>
    </div>


    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script>

        $("#checkBtn").on("click",function () {
            let url = $("#urlInput").val();
            if (url == "") {
                alert("URL을 입력해주세요");
                return ;
            }

            $.ajax({
                type: "get"
                ,url: "/favorites/add"
                , data: {"url":url}
                , success: function (response) {
                    if () {
                        alert("중복된 URL입니다");
                    } else {
                        alert("저장 가능한 URL입니다");
                    }
                }
                , error: function () {
                    alert("중복 확인 에러");
                }
            })

        })
    </script>

        </body>
</html>
