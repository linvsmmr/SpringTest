<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>날씨 정보 페이지</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/css/thymeleaf/style.css">
</head>
<body>
<div id="wrap" class="container">
    <section class="contents d-flex">
        <nav class="main-menu col-2">
            <div class="d-flex justify-content-center mt-3">
                <img width="25" src="http://marondal.com/material/images/dulumary/web/jstl/weather-logo.png">
                <div class="text-white font-weight-bold ml-1">기상청</div>
            </div>
            <ul class="nav flex-column font-weight-bold mt-4">
                <li class="nav-item"><a href="#" class="nav-link text-white">날씨</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">날씨 입력</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">테마날씨</a></li>
                <li class="nav-item"><a href="#" class="nav-link text-white">관측기후</a></li>
            </ul>
        </nav>
        <article class="main-contents col-10">
            <h3>과거 날씨</h3>
            <table class="table">
                <thead>
                    <tr>
                        <th>날짜</th>
                        <th>날씨</th>
                        <th>기온</th>
                        <th>강수량</th>
                        <th>미세먼지</th>
                        <th>풍속</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="weather : ${weatherList}">
                        <td th:text="${#temporals.format(weather.date,'yyyy년 M월 d일')}">dd</td>
                        <td>
                            <span th:if="${weather.weather} == '맑음'">
                                <img src="http://marondal.com/material/images/dulumary/web/jstl/sunny.jpg">
                            </span>
                            <span th:if="${weather.weather} == '구름조금'">
                                <img src="http://marondal.com/material/images/dulumary/web/jstl/partlyCloudy.jpg">
                            </span>
                            <span th:if="${weather.weather} == '흐림'">
                                <img src="http://marondal.com/material/images/dulumary/web/jstl/cloudy.jpg">
                            </span>
                            <span th:if="${weather.weather} == '비'">
                                <img src="http://marondal.com/material/images/dulumary/web/jstl/rainy.jpg">
                            </span>
                        </td>
                        <td th:text="|${weather.temperatures}℃|"></td>
                        <td th:text="|${weather.precipitation}mm|">dd</td>
                        <td th:text="${weather.microDust}">dd</td>
                        <td th:text="|${weather.windSpeed}km/h|">dd</td>
                    </tr>
                </tbody>
            </table>
        </article>
    </section>

    <footer class="d-flex">
        <div class="mt-3 ml-4">
            <img width="120" src="http://marondal.com/material/images/dulumary/web/jstl/weather-footer.png">
        </div>
        <div class="small text-secondary mt-3 ml-5">
            (07062) 서울시 동작구 여의방대로16길 61 <br>
            Copyright@2020 KMA. All Rights RESERVED.
        </div>
    </footer>
</div>
