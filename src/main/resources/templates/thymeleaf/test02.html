<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>Test02</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
</head>
<body>
    <h2>멤버십</h2>
    <table class="table text-center">
        <thead>
            <tr>
                <th>이름</th>
                <th>전화 번호</th>
                <th>등급</th>
                <th>포인트</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="member:${membership}">
                <td th:text="${member.name}">손오공</td>
                <td th:text="${member.phoneNumber}">010010100011</td>
<!--                <td th:text="${member.grade}"-->
<!--                th:style="${member.grade == 'VIP'} ? 'color:red' : ''">브아피</td>-->

                <td th:if="${member.grade}"
                    th:style="|${member.grade == 'VIP'
                ? 'color:red'
                : (member.grade == 'GOLD' ? 'color:gold' : '')}|">
                    브아피
                </td>
                <td th:text="${member.point}"
                th:style="${member.point >= 5000} ? 'color:blue' : ''">1287321</td>
            </tr>
        </tbody>
    </table>
</body>
</html>
