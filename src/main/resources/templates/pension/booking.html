<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>예약하기</title>
    <link rel="stylesheet" href="https://code.jquery.com/ui/1.14.1/themes/base/jquery-ui.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css" integrity="sha384-xOolHFLEh07PJGoPkLv1IbcEPTNtaed2xpHsD9ESMhqIYd0nLMwNLD69Npy4HI+N" crossorigin="anonymous">
    <link rel="stylesheet" href="/pension/css/style.css">
</head>
<body>
<div id="wrap">
    <header class="d-flex justify-content-center align-items-center">
        <div class="display-4">통나무 펜션</div>
    </header>
    <nav class="main-menu">
        <ul class="nav nav-fill font-weight-bold">
            <li class="nav-item"><a href="#" class="nav-link text-white">펜션소개</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-white">객실보기</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-white">예약안내</a></li>
            <li class="nav-item"><a href="#" class="nav-link text-white">커뮤니티</a></li>
        </ul>
    </nav>
    <section class="contents">
        <h3 class="mt-4 mb-4 text-center">예약 하기</h3>
        <div class="book-menu">
            <label>이름</label><input type="text" class="form-control" id="nameInput">
            <label>예약날짜</label><input type="text" class="form-control" id="dateInput">
            <label>숙박일수</label><input type="text" class="form-control" id="dayInput">
            <label>숙박인원</label><input type="text" class="form-control" id="headcountInput">
            <label>전화번호</label><input type="text" class="form-control" id="phoneNumberInput">
            <button type="button" id="bookingBtn" class="btn btn-warning text-center mt-4 btn-block">예약하기</button>
        </div>


    </section>
    <footer class="mt-3">
        <div class="small text-secondary">
            제주특별자치도 제주시 애월읍  <br>
            사업자등록번호: 111-22-255222 / 농어촌민박사업자지정 / 대표:김통목 <br>
            Copyright 2025 tongnamu All right reserved
        </div>
    </footer>
</div>



<script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
<script>


    $("#bookingBtn").on("click", function() {
        let name = $("#nameInput").val();
        let date = $("#dateInput").val();
        let day = $("#dayInput").val();
        let headcount = $("#headcountInput").val();
        let phoneNumber = $("#phoneNumberInput").val();

        if (name == "") {
            alert("이름을 입력하세요");
            return;
        }

        if (date == "") {
            alert("예약일자를 입력하세요");
            return;
        }

        if (day == "") {
            alert("숙박일수를 입력하세요");
            return;
        }

        if (headcount == "") {
            alert("숙박인원을 입력하세요");
            return;
        }

        if (phoneNumber == "") {
            alert("전화번호를 입력하세요");
            return;
        }

        $.ajax({
            type: "get"
            , url: "/pension/booking"
            , data: {"name": name, "date": date, "day": day, "headcount": headcount, "phoneNumber": phoneNumber}
            , success: function () {
                alert("추가 완료")
            }
            , error: function () {
                alert("추가 에러")
            }
        })
    });


</script>
</body>
</html>
